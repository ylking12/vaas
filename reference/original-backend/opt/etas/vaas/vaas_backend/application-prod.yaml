spring:
  banner:
    charset: UTF-8
    location: static/banner.txt
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/vaas?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  servlet:
    context-path: /spring/v1
  port: 50410

logging:
  config: file:./logback-spring.xml
gps:
  clean:
    interval: 3600000    
    expireTime: 86400000  

kt710:
  max-queue-size: 80000
  topic: kt710-topic
  consumer-count: 1
  key-prefix: kt710:queue

offline-threshold: 5000 # ms

event:
  maxReturnedBumpEventAmount: 375

district:
  centroids:
    - name: 锡山区
      longitude: 120.45
      latitude: 31.60

    - name: 惠山区
      longitude: 120.31
      latitude: 31.68

    - name: 滨湖区
      longitude: 120.31
      latitude: 31.50

    - name: 梁溪区
      longitude: 120.30
      latitude: 31.58

    - name: 新吴区
      longitude: 120.43
      latitude: 31.51

serialNumber:
  filter:
    enabled: false

sensors:
  enabled: true
  event_detect_interval: 900000
  sdks:
    sdk2:
      enabled: true
      port: 2555
      class-name: RSServerController
    sdk3:
      enabled: true
      port: 2345
      host: 0.0.0.0
      class-name: deviceServiceController
      param-file:
