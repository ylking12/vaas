  road-ids:
    #    文惠路与锦绣路
    1:
      Station: 21098126
      RoadCondition: 15500257
      Atmospheric: 21098575
    #     贡湖大道与金城路口
    2:
      Station: 21113177
      RoadCondition: 15500542
      Atmospheric: 21118286
    #      机场路-泰山路
    3:
      Station: 21113179
      RoadCondition: 15500543
      Atmospheric: 21118289
    #      高浪路-兴梁道
    4:
      Station: 21113178
      RoadCondition: 15500545
      Atmospheric: 21118288
    #      运河西路
    5:
      Station: 21113183
      RoadCondition: 15500544
      Atmospheric: 21118287
  cache:
    format:
      measurement: Wsensor_{0}_last24h_measurement
      event: Wsensor_{0}_last24h_event
  data:
    Station:
      WindStrength:
        dataType: Analog1
        index: 1
        key: windStrength
        unit:
        coefficient: 1
      WindSpeed:
        dataType: Analog2
        index: 1
        key: windSpeed
        unit: m/s
        coefficient: 1
      WindDirection:
        dataType: Analog1
        index: 2
        key: windDirection
        coefficient: 1
      AirTemperature:
        dataType: Analog1
        index: 3
        key: airTemperature
        unit: °C
        coefficient: 1
      RelativeHumidity:
        dataType: Analog2
        index: 3
        key: relativeHumidity
        #          todo:%无法通过编译
        unit: '%'
        coefficient: 1
    RoadCondition:
      RoadConditions:
        dataType: UNSigned32INT
        index: 1
        key: roadConditions
        coefficient: 1
      PondingDepth:
        dataType: Float
        index: 2
        key: pondingDepth
        coefficient: 1
      IceThickness:
        dataType: Float
        index: 3
        key: iceThickness
        coefficient: 1
      RoadSurfaceTemperature:
        dataType: Float
        index: 5
        key: roadSurfaceTemperature
        coefficient: 1

    Atmospheric:
      AtmosphericVisibility:
        dataType: Analog1
        index: 1
        key: atmosphericVisibility
        #        todo: 单位是什么
        unit:
        coefficient: 0.1
  dataMatchSensor:
    windStrength: Station
    windSpeed: Station
    windDirection: Station
    airTemperature: Station
    relativeHumidity: Station
    roadConditions: RoadCondition
    waterDepth: RoadCondition
    iceThickness: RoadCondition
    roadSurfaceTemperature: RoadCondition
    atmosphericVisibility: Atmospheric
  event:
    waterLayerThickness:
      compareType: GreatAndEq
      data-type: Float
      key: pondingDepth
      event-type: water_event
      value: 1
    levelOfGrip:
      compareType: LessAndEq
      data-type: Float
      key: waterLayerThickness
      event-type: low_attachment_event
      value: 0.62
    ice-signal:
      compareType: Eq
      data-type: UNSigned32INT
      key: roadConditions
      event-type: ice_event
      value: 7
    wet_signal:
      compareType: Eq
      data-type: UNSigned32INT
      key: roadConditions
      event-type: wet_event
      value: 3
