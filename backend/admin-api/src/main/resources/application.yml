spring:
  application:
    name: admin-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vaas?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 50415
logging:
  level:
    com.etas.vaas.admin: debug


# UserService config
password-path: ./config/password.txt
