spring:
  application:
    name: detector4motion
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vaas?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 50414

detector:
  motion:
    bump-level-3:
      yAmplitude: 0.14
      zAmplitude: 0.175
    bump-level-5:
      yAmplitude: 0.16
      zAmplitude: 0.20
    bump-level-7:
      yAmplitude: 0.20
      zAmplitude: 0.25

logging:
  level:
    com.etas.vaas.detector4motion: debug
